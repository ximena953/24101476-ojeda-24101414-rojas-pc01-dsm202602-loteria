# Memoria para Gradle y codificación de archivos.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Usar las librerías AndroidX (obligatorio para Jetpack Compose).
android.useAndroidX=true
# Cada módulo solo ve sus propios recursos R (builds más rápidos).
android.nonTransitiveRClass=true
# Estilo de código oficial de Kotlin.
kotlin.code.style=official
